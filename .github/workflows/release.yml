name: Build e release do APK

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write # necessário para criar a release e a tag

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # segredos não podem ir direto num "if": vira uma flag do job
      HAS_KEYSTORE: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # baixa o SDK/Gradle uma vez e reaproveita nas próximas execuções
      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura própria (opcional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "PAPYRUS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # o pdfbox de verdade extraindo texto e fotos de um PDF de exemplo: se a importação
      # quebrar, o APK não é publicado
      - name: Testes (extração de texto dos PDFs)
        env:
          PAPYRUS_DEBUG_DIR: /tmp/papyrus-debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest -Pandroid.useAndroidX=true -PbuildNumber=${{ github.run_number }} -i 2>&1 | grep -E "pior diferença|->|FAILED|PASSED|Exception|at dev\.|BUILD" | head -80; test ${PIPESTATUS[0]} -eq 0

      - name: Imagens de diagnóstico
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: debug-png
          path: /tmp/papyrus-debug
          if-no-files-found: ignore

      - name: Compilar APK de release
        if: github.ref == 'refs/heads/main'
        env:
          PAPYRUS_KEYSTORE_PASSWORD: ${{ secrets.PAPYRUS_KEYSTORE_PASSWORD }}
          PAPYRUS_KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          PAPYRUS_KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk papyrus-v1.0.${{ github.run_number }}.apk

      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: papyrus 1.0.${{ github.run_number }}
          body: |
            APK compilado automaticamente a partir de ${{ github.sha }}.
            Instale o arquivo .apk abaixo (atualiza por cima da versão anterior).
          files: papyrus-v1.0.${{ github.run_number }}.apk
          make_latest: true
