name: Build e release do APK

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write # necessário para criar a release e a tag

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # segredos não podem ir direto num "if": vira uma flag do job
      HAS_KEYSTORE: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # baixa o SDK/Gradle uma vez e reaproveita nas próximas execuções
      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura própria (opcional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "PAPYRUS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # o Android simulado dos testes (Robolectric) é baixado do Maven na primeira vez:
      # guardado em cache para não depender da rede a cada build
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}

      # pdfbox extraindo texto e fotos de um PDF, seleção de EPUB conferida contra as letras
      # desenhadas e o dicionário: se algo quebrar, o APK não é publicado
      - name: Testes
        run: |
          chmod +x gradlew
          # uma segunda tentativa se a primeira falhar (download instável do Maven)
          for t in 1 2; do
            ./gradlew --no-daemon testReleaseUnitTest -Pandroid.useAndroidX=true -PbuildNumber=${{ github.run_number }} && exit 0
            echo "Testes falharam (tentativa $t)"; sleep 20
          done
          exit 1

      - name: Compilar APK de release
        if: github.ref == 'refs/heads/main'
        env:
          PAPYRUS_KEYSTORE_PASSWORD: ${{ secrets.PAPYRUS_KEYSTORE_PASSWORD }}
          PAPYRUS_KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          PAPYRUS_KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk papyrus-v1.0.${{ github.run_number }}.apk

      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: papyrus 1.0.${{ github.run_number }}
          body: |
            APK compilado automaticamente a partir de ${{ github.sha }}.
            Instale o arquivo .apk abaixo (atualiza por cima da versão anterior).
          files: papyrus-v1.0.${{ github.run_number }}.apk
          make_latest: true
